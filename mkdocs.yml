site_name: Oichin Health & Relationship Guide
site_description: Practical guides about health, relationships, lifestyle and sexual wellness.
site_url: !ENV READTHEDOCS_CANONICAL_URL

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Health:
      - Sleep and Health: health/sleep.md
      - Daily Habits: health/daily-habits.md
      - Rest and Recovery: health/rest.md
      - Stress Management: health/stress.md
  - Relationships:
      - Long-Term Love: relationships/long-term-love.md
      - Communication: relationships/communication.md
      - Personal Space: relationships/personal-space.md
      - Work, Love and Life: relationships/work-love-life.md
  - Sexual Wellness:
      - Sexual Health: sexual-wellness/sexual-health.md
      - Intimacy and Communication: sexual-wellness/intimacy.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
